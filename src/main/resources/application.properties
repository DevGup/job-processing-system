spring.application.name=job-processing-system

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/jobdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:jobapp}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:jobapp-local-password}
spring.datasource.hikari.initialization-fail-timeout=60000

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.admin.fail-fast=true
spring.kafka.consumer.group-id=${APP_KAFKA_CONSUMER_GROUP:job-worker-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.acks=all
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.listener.ack-mode=record
spring.kafka.listener.concurrency=${APP_KAFKA_CONCURRENCY:3}

app.kafka.topics.requests=${APP_KAFKA_REQUESTS_TOPIC:job-requests}
app.kafka.topics.requests-partitions=${APP_KAFKA_REQUESTS_PARTITIONS:3}
app.kafka.topics.dlq=${APP_KAFKA_DLQ_TOPIC:job-dlq}
app.kafka.consumer-group=${APP_KAFKA_CONSUMER_GROUP:job-worker-group}
app.kafka.dlq-consumer-group=${APP_KAFKA_DLQ_CONSUMER_GROUP:job-dlq-group}
app.jobs.max-retries=${APP_JOBS_MAX_RETRIES:3}
app.jobs.recovery-interval-ms=${APP_JOBS_RECOVERY_INTERVAL_MS:30000}
app.jobs.recovery-batch-size=${APP_JOBS_RECOVERY_BATCH_SIZE:100}
app.jobs.processing-timeout-seconds=${APP_JOBS_PROCESSING_TIMEOUT_SECONDS:300}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.health.kafka.enabled=true

spring.security.user.name=${JOB_API_USERNAME}
spring.security.user.password=${JOB_API_PASSWORD}



