name: Scheduler CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Test and start the stack
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      JOB_API_USERNAME: scheduler-ci
    steps:
      - name: Create credentials for this test run
        shell: bash
        run: |
          password=$(openssl rand -hex 32)
          jwt_secret=$(openssl rand -base64 32)
          echo "::add-mask::$password"
          echo "::add-mask::$jwt_secret"
          echo "JOB_API_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "JOB_JWT_SECRET=$jwt_secret" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven tests
        run: bash ./mvnw -B -ntp verify

      - name: Build and start with Compose
        run: docker compose up --build --wait --wait-timeout 300

      - name: Register users and verify JWT login
        shell: bash
        run: |
          api="http://127.0.0.1:${JOB_API_PORT:-8080}"
          curl --fail --silent --show-error --max-time 10 "$api/actuator/health" \
            | jq -e '.status == "UP"'
          status=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' "$api/jobs")
          [[ "$status" == 401 ]]
          status=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' \
            -H 'Authorization: Bearer invalid-token' "$api/jobs")
          [[ "$status" == 401 ]]
          save_token() {
            local env_name=$1 credentials=$2 token
            token=$(curl -fsS --max-time 10 --json "$credentials" "$api/auth/login" \
              | jq -er '.accessToken | strings | select(length > 0)')
            echo "::add-mask::$token"
            echo "$env_name=$token" >> "$GITHUB_ENV"
          }
          for username in alice bob; do
            credentials=$(jq -nc --arg username "$username" --arg password "$(openssl rand -hex 24)" \
              '{username: $username, password: $password}')
            curl -fsS --max-time 10 --json "$credentials" "$api/auth/register" -o /dev/null
            save_token "${username^^}_TOKEN" "$credentials"
          done
          admin_credentials=$(jq -nc --arg username "$JOB_API_USERNAME" --arg password "$JOB_API_PASSWORD" \
            '{username: $username, password: $password}')
          save_token ADMIN_TOKEN "$admin_credentials"

      - name: Submit a job and verify it completes
        shell: bash
        run: |
          api="http://127.0.0.1:${JOB_API_PORT:-8080}"
          auth=(-H "Authorization: Bearer $ALICE_TOKEN")
          job_id=$(curl --fail --silent --show-error --max-time 10 "${auth[@]}" \
            --header 'Content-Type: application/json' \
            --data '{"type":"email"}' "$api/jobs" \
            | jq -er '.id | numbers')
          echo "ALICE_JOB_ID=$job_id" >> "$GITHUB_ENV"

          for attempt in {1..30}; do
            status=$(curl --fail --silent --show-error --max-time 5 "${auth[@]}" "$api/jobs/$job_id" \
              | jq -er '.status')
            echo "Job $job_id status: $status"
            if [[ "$status" == DONE ]]; then
              exit 0
            fi
            sleep 2
          done

          echo "Job $job_id did not complete in time" >&2
          exit 1

      - name: Verify job ownership and admin permissions
        shell: bash
        run: |
          api="http://127.0.0.1:${JOB_API_PORT:-8080}"
          job_url="$api/jobs/$ALICE_JOB_ID"
          alice=(-H "Authorization: Bearer $ALICE_TOKEN")
          bob=(-H "Authorization: Bearer $BOB_TOKEN")
          admin=(-H "Authorization: Bearer $ADMIN_TOKEN")
          expect_status() {
            local expected=$1 actual
            shift
            actual=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' "$@")
            if [[ "$actual" != "$expected" ]]; then
              echo "Expected HTTP $expected, received $actual" >&2
              return 1
            fi
          }
          curl -fsS --max-time 10 "${alice[@]}" "$api/jobs" | jq -e --argjson id "$ALICE_JOB_ID" 'any(.[]; .id == $id)'
          curl -fsS --max-time 10 "${bob[@]}" "$api/jobs" | jq -e 'length == 0'
          expect_status 404 "${bob[@]}" "$job_url"
          expect_status 404 "${bob[@]}" -X DELETE "$job_url"
          expect_status 400 "${bob[@]}" --json '{"type":"report","userId":1}' "$api/jobs"
          expect_status 403 "${alice[@]}" -X POST "$api/jobs/retry-dlq/$ALICE_JOB_ID"
          expect_status 403 "${alice[@]}" -X PUT --json '{"status":"DONE"}' "$job_url/status"
          expect_status 200 "${admin[@]}" "$job_url"
          expect_status 200 "${admin[@]}" -X PUT --json '{"status":"DONE"}' "$job_url/status"
          expect_status 200 "${alice[@]}" "$job_url"

      - name: Verify retry delays and dead-letter delivery
        shell: bash
        run: |
          api="http://127.0.0.1:${JOB_API_PORT:-8080}"
          auth=(-H "Authorization: Bearer $ALICE_TOKEN")
          job_id=$(curl -fsS --max-time 10 "${auth[@]}" \
            -H 'Content-Type: application/json' \
            --data '{"type":"fail"}' "$api/jobs" \
            | jq -er '.id')
          echo "Created job $job_id"
          for attempt in {1..30}; do
            job=$(curl -fsS --max-time 5 "${auth[@]}" "$api/jobs/$job_id")
            if jq -e '.status == "FAILED"' <<< "$job" > /dev/null; then
              echo "Job $job_id reached FAILED"
              jq -e '
                def seconds: .[0:19] + "Z" | fromdateiso8601;
                .retryCount == 3 and .nextRetryAt == null and
                ((.failedAt | seconds) - (.createdAt | seconds) >= 7)
              ' <<< "$job"
              dlq_job_id=$(docker compose exec -T kafka kafka-console-consumer \
                --bootstrap-server kafka:9092 --topic job-dlq --from-beginning \
                --max-messages 1 --timeout-ms 20000)
              [[ "$dlq_job_id" == "$job_id" ]]
              exit 0
            fi
            sleep 2
          done

          echo "Job $job_id did not reach FAILED in time"
          exit 1

      - name: Verify the report job saves a result
        shell: bash
        run: |
          api="http://127.0.0.1:${JOB_API_PORT:-8080}"
          auth=(-H "Authorization: Bearer $ALICE_TOKEN")
          job_id=$(curl -fsS --max-time 10 "${auth[@]}" \
            -H 'Content-Type: application/json' \
            --data '{"type":"report"}' "$api/jobs" \
            | jq -er '.id')

          for attempt in {1..30}; do
            job=$(curl -fsS --max-time 5 "${auth[@]}" "$api/jobs/$job_id")
            if jq -e '.status == "DONE"' <<< "$job" > /dev/null; then
              jq -e '.result == "Completed jobs: 1, Failed jobs: 1"' <<< "$job"
              exit 0
            fi
            sleep 2
          done

          echo "Report job $job_id did not reach DONE in time" >&2
          exit 1

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --tail 100

      - name: Remove the runner's test stack and volumes
        if: always()
        run: docker compose down --volumes

  publish:
    name: Publish to GitHub Container Registry
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set image tag from the Git commit
        id: image
        shell: bash
        run: echo "tag=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
