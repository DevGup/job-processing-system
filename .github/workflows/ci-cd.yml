name: Scheduler CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Test and start the stack
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      JOB_API_USERNAME: scheduler-ci
    steps:
      - name: Create a password for this test run
        shell: bash
        run: |
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          echo "JOB_API_PASSWORD=$password" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven tests
        run: bash ./mvnw -B -ntp verify

      - name: Build and start with Compose
        run: docker compose up --build --wait --wait-timeout 300

      - name: Check API login and get a CSRF token
        shell: bash
        run: |
          api="http://127.0.0.1:${JOB_API_PORT:-8080}"
          curl --fail --silent --show-error --max-time 10 "$api/actuator/health" \
            | jq -e '.status == "UP"'
          status=$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' "$api/jobs")
          [[ "$status" == 401 ]]
          auth=(--user "$JOB_API_USERNAME:$JOB_API_PASSWORD")
          status=$(curl -sS --max-time 10 "${auth[@]}" -o /dev/null -w '%{http_code}' \
            -H 'Content-Type: application/json' --data '{}' "$api/jobs")
          [[ "$status" == 403 ]]
          token=$(curl -fsS --max-time 10 "${auth[@]}" --cookie-jar "$RUNNER_TEMP/jobs.cookies" \
            "$api/csrf" | jq -er '.token | strings | select(length > 0)')
          echo "::add-mask::$token"
          echo "JOB_CSRF_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Submit a job and verify it completes
        shell: bash
        run: |
          api="http://127.0.0.1:${JOB_API_PORT:-8080}"
          auth=(--user "$JOB_API_USERNAME:$JOB_API_PASSWORD")
          job_id=$(curl --fail --silent --show-error --max-time 10 "${auth[@]}" \
            --cookie "$RUNNER_TEMP/jobs.cookies" -H "X-CSRF-TOKEN: $JOB_CSRF_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"type":"email","userId":1}' "$api/jobs" \
            | jq -er '.id | numbers')

          for attempt in {1..30}; do
            status=$(curl --fail --silent --show-error --max-time 5 "${auth[@]}" "$api/jobs/$job_id" \
              | jq -er '.status')
            echo "Job $job_id status: $status"
            if [[ "$status" == DONE ]]; then
              exit 0
            fi
            sleep 2
          done

          echo "Job $job_id did not complete in time" >&2
          exit 1
      
      - name: Verify retry delays and dead-letter delivery
        shell: bash
        run: |
          api="http://127.0.0.1:${JOB_API_PORT:-8080}"
          auth=(--user "$JOB_API_USERNAME:$JOB_API_PASSWORD")
          job_id=$(curl -fsS --max-time 10 "${auth[@]}" \
            --cookie "$RUNNER_TEMP/jobs.cookies" -H "X-CSRF-TOKEN: $JOB_CSRF_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"type":"fail","userId":1}' "$api/jobs" \
            | jq -er '.id')
          echo "Created job $job_id"
          for attempt in {1..30}; do
            job=$(curl -fsS --max-time 5 "${auth[@]}" "$api/jobs/$job_id")
            if jq -e '.status == "FAILED"' <<< "$job" > /dev/null; then
              echo "Job $job_id reached FAILED"
              jq -e '
                def seconds: .[0:19] + "Z" | fromdateiso8601;
                .retryCount == 3 and .nextRetryAt == null and
                ((.failedAt | seconds) - (.createdAt | seconds) >= 7)
              ' <<< "$job"
              dlq_job_id=$(docker compose exec -T kafka kafka-console-consumer \
                --bootstrap-server kafka:9092 --topic job-dlq --from-beginning \
                --max-messages 1 --timeout-ms 20000)
              [[ "$dlq_job_id" == "$job_id" ]]
              exit 0
            fi
            sleep 2
          done

          echo "Job $job_id did not reach FAILED in time"
          exit 1

      - name: Verify the report job saves a result
        shell: bash
        run: |
          api="http://127.0.0.1:${JOB_API_PORT:-8080}"
          auth=(--user "$JOB_API_USERNAME:$JOB_API_PASSWORD")
          job_id=$(curl -fsS --max-time 10 "${auth[@]}" \
            --cookie "$RUNNER_TEMP/jobs.cookies" -H "X-CSRF-TOKEN: $JOB_CSRF_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"type":"report","userId":1}' "$api/jobs" \
            | jq -er '.id')

          for attempt in {1..30}; do
            job=$(curl -fsS --max-time 5 "${auth[@]}" "$api/jobs/$job_id")
            if jq -e '.status == "DONE"' <<< "$job" > /dev/null; then
              jq -e '.result == "Completed jobs: 1, Failed jobs: 1"' <<< "$job"
              exit 0
            fi
            sleep 2
          done

          echo "Report job $job_id did not reach DONE in time" >&2
          exit 1

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --tail 100

      - name: Remove the runner's test stack and volumes
        if: always()
        run: docker compose down --volumes

  publish:
    name: Publish to GitHub Container Registry
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set image tag from the Git commit
        id: image
        shell: bash
        run: echo "tag=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
